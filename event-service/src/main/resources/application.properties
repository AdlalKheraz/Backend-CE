server.port=8083
spring.application.name=event-service

# Datasource
spring.datasource.url=jdbc:mysql://localhost:3308/event_db
# spring.datasource.username=chrono
# spring.datasource.password=chrono_pass
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT shared secret
jwt.secret=VerySecretKeyThatIsAtLeast256BitsLongToBeSecure123456!

# Media service URL
media-service.url=http://localhost:8082
# Uncomment for Docker
# media-service.url=http://media-service:8082
