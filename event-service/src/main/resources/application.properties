spring.application.name=event-service

# APPLICATION
server.port=8082
spring.application.name=event-service
# Path matching strategy to ensure proper controller routing
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER
# Enable throwing NoHandlerFoundException
spring.mvc.throw-exception-if-no-handler-found=true
# Disable static resources
spring.web.resources.add-mappings=false

# DATASOURCE
spring.datasource.url=jdbc:mysql://localhost:3308/event_db
# spring.datasource.username=chrono
# spring.datasource.password=chrono_pass
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# LOGGING
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG

# OPEN FEIGN (si utilisé plus tard)
# feign.client.config.default.connectTimeout=5000
# feign.client.config.default.readTimeout=5000

# TIMEZONE (optionnel)
spring.jackson.time-zone=UTC
