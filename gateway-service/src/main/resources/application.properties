spring.application.name=gateway-service
server.port=8080


# Routes vers les microservices
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1


spring.cloud.gateway.routes[1].id=media-service
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/media/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=2


spring.cloud.gateway.routes[2].id=event-service
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/event/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=2

# Logging pour debug
logging.level.org.springframework.cloud.gateway=DEBUG
