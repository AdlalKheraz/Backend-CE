# ===== APPLICATION =====
spring.application.name=auth-service
server.port=8081

# ===== DATABASE =====
spring.datasource.url=jdbc:mysql://localhost:3307/auth_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / HIBERNATE =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===== JWT CONFIGURATION =====
# Clé secrète encodée en Base64 (utilisée pour signer les tokens)
jwt.secret=U29tZVN1cGVyU2VjdXJlS2V5Rm9ySlNXVFZhbGlkYXRpb24hIQ==
# Durée de validité du token en millisecondes (24 heures)
jwt.expiration=86400000
